server:
  port: 8080

spring:
  application:
    name: enterprise-rbac

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rbac_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: admin
        url-pattern: /druid/*

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置。受保护接口两种合法写法：Authorization: Bearer <token>，或请求头里只放三段 JWT。
# Knife4j 点 Authorize 时只填登录返回的 token，不要自己再写 Bearer。
jwt:
  secret: rbacSystemSecretKey2026ChangeThisInProduction
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# Knife4j 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 企业权限角色分配系统接口文档
    description: RBAC权限管理系统API
    version: 1.0.0

logging:
  level:
    root: info
    org.example.rbac: debug
